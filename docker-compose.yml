services:
    app:
        build:
            context: .
            dockerfile: ./docker/dev.Dockerfile
        container_name: app
        restart: unless-stopped
        volumes:
            - .:/var/www/html
        ports:
            - "8000:8000"
        depends_on:
            - redis
            - mailpit
        environment:
            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: 1025

    nginx:
        image: nginx:latest
        container_name: nginx
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    redis:
        image: redis:7
        container_name: redis
        restart: unless-stopped
        ports:
            - "6379:6379"

    mailpit:
        image: axllent/mailpit:latest
        container_name: mailpit
        restart: unless-stopped
        ports:
            - "1025:1025"
            - "8025:8025"
