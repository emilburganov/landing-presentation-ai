services:
    app:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        container_name: app
        restart: unless-stopped
        volumes:
            - .:/var/www/html
        ports:
            - "8000:8000"
        depends_on:
            - redis

    nginx:
        image: nginx:latest
        container_name: nginx
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    redis:
        image: redis:7
        container_name: redis
        restart: unless-stopped
        ports:
            - "6379:6379"
